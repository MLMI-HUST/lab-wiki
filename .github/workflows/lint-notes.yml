name: Lint Notes

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check notes
        run: python scripts/check_notes.py content/

      - name: Check wikilinks
        run: python scripts/check_wikilinks.py content/

      - name: Check attachments
        run: python scripts/check_attachments.py content/
