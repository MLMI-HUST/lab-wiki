name: Update MOC

on:
  push:
    branches: [main]
    paths:
      - "content/**"

permissions:
  contents: write

jobs:
  update-moc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate MOC
        run: python3 scripts/generate_moc.py content/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update MOC [skip ci]"
            git push
          fi
