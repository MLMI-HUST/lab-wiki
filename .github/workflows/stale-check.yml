name: Stale Check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  stale-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run stale check
        run: python3 scripts/stale_check.py content/ --threshold 180

      - name: Create PR if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/stale-check-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No stale notes to update"
          else
            git commit -m "chore: stale notes check (threshold 180 days)"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "chore: stale notes check" \
              --body "Automated stale notes check (threshold: 180 days). Generated by GitHub Actions." \
              --base main
          fi
